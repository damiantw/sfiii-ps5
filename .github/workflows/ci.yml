name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: No disc data
        run: tools/ci/no-disc-data.sh
      - name: Packages (Vulkan, lavapipe, SDL2)
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers libsdl2-dev p7zip-full
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSF3_PS5_DEVTOOLS=ON
      - name: Build
        run: cmake --build build -j4
      - name: Debug server test
        run: tools/devtools/test_sf3dev.py build/test_debug_server
      - name: Patcher quirks vs the Python patcher
        run: python3 tests/patch_quirks.py external/sfiii-native build
      - name: Menu runtime glue (fake runtime)
        run: build/runtime_host_test
      - name: Runtime binding compiles against the pinned, patched saturn-recomp
        run: |
          rt=$(python3 -c "import json;d=json.load(open('external/sfiii-native/dependencies.json'))['runtime'];print(d['url'],d['commit'])")
          set -- $rt
          git clone -q "$1" /tmp/saturn-recomp && git -C /tmp/saturn-recomp checkout -q "$2"
          git -C /tmp/saturn-recomp apply "$PWD/external/sfiii-native/tools/runtime-diagnostics.patch"
          cmake -S . -B build-rt -DSF3_PS5_RUNTIME_DIR=/tmp/saturn-recomp -DSF3_PS5_DEVTOOLS=ON
          cmake --build build-rt -j4 --target sf3ps5_runtime_bind sf3ps5_runtime_agent sf3ps5_host_runtime
      - name: PS5 download transport (sceHttp logic on a fake library)
        run: build/fetch_sce_test
      - name: PS5 download transport, console binding compiles
        run: g++ -std=c++17 -fsyntax-only -DSF3_PS5_CONSOLE -Isrc src/patch/fetch_sce.cpp
      - name: .7z add-on decoder
        run: tests/sevenzip_test.sh build
      - name: Vulkan scene test (lavapipe)
        run: build/vk_scene_test
      - name: Vulkan menu test (lavapipe, SDL2 virtual pad)
        env:
          SDL_VIDEODRIVER: dummy
        run: build/vk_menu_test
      - name: PS5 host test (pacer, pad, 48 kHz audio on SDL's disk driver, menu over frames, relaunch)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: disk
        run: build/host_test
      - name: Release check (dev build must be flagged)
        run: "! tools/check-release.sh build/test_debug_server"
